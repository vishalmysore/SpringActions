##Gemini related settings
gemini.modelName=gemini-2.0-flash-001
#gemini.modelName=test
#gemini.modelName=gemini-1.5-pro-preview-0409
gemini.location=us-central1
gemini.projectId=cookgptserver
#gemini.projectId=test
gemini.vision.modelName=gemini-1.0-pro-vision

##Anthropic related settings
anthropic.modelName=claude-3-haiku-20240307
anthropic.logRequests=true
anthropic.logResponse=true

#set it here or use -DclaudeKey parameter
claudeKey=

##Open AI Key
#set it here or use -DopenAiKey parameter
## Any non-empty value works when pointing at local Ollama (Ollama ignores the key).
openAiKey=ollama
##Open AI Base URL - point at local Ollama's OpenAI-compatible API to run fully offline.
## For real OpenAI, clear this and set a real openAiKey above.
openAiBaseURL=http://localhost:11434/v1

## Use a capable local model tag you have pulled (e.g. phi4:latest, llama3.1).
openAiModelName=phi4:latest

## Per-call timeout in MINUTES (default 1). Local CPU models can be slow, so bump it.
maxTimeOutForOpenAI=3

##Serper Key for google search or hallucination detection
serperKey=

agent.provider=openai

## Action packages to scan only actions form this package will be available to yoga server
## action.packages.to.scan=org.example.yoga

mcp.tools.servername=The Best Server For Customer Service
mcp.tools.version=1.0.0
a2a.card.name=Tools4AI Based A2A Server
